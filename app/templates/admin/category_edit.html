{% extends 'admin/base_admin.html' %}
{% block title %}Edit Kategori | Unit Indrapura{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h3>Edit Kategori</h3><a href="{{ url_for('admin.categories') }}" class="btn btn-outline-secondary">Kembali</a></div>
<div class="card-box">
  <form method="POST" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-12"><label class="form-label">Nama Kategori</label><input class="form-control" name="nama_kategori" value="{{ category.nama_kategori }}" required></div>
    <div class="col-12"><label class="form-label">Deskripsi</label><textarea class="form-control" name="deskripsi" rows="4">{{ category.deskripsi or '' }}</textarea></div>
    <div class="col-12"><button class="btn btn-primary" type="submit">Simpan Perubahan</button></div>
  </form>
</div>
{% endblock %}
