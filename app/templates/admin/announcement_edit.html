{% extends 'admin/base_admin.html' %}
{% block title %}Edit Pengumuman | Unit Indrapura{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h3>Edit Pengumuman</h3><a href="{{ url_for('admin.announcements') }}" class="btn btn-outline-secondary">Kembali</a></div>
<div class="card-box">
  <form method="POST" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-6"><label class="form-label">Judul</label><input class="form-control" name="judul" value="{{ announcement.judul }}" required></div>
    <div class="col-md-6"><label class="form-label">Slug</label><input class="form-control" name="slug" value="{{ announcement.slug }}" required></div>
    <div class="col-12"><label class="form-label">Isi</label><textarea class="form-control" name="isi" rows="6" required>{{ announcement.isi }}</textarea></div>
    <div class="col-md-6"><label class="form-label">URL Gambar</label><input class="form-control" name="gambar" value="{{ announcement.gambar or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status"><option value="aktif" {% if announcement.status == 'aktif' %}selected{% endif %}>Aktif</option><option value="tidak_aktif" {% if announcement.status == 'tidak_aktif' %}selected{% endif %}>Tidak Aktif</option></select></div>
    <div class="col-12"><button class="btn btn-primary" type="submit">Simpan Perubahan</button></div>
  </form>
</div>
{% endblock %}
